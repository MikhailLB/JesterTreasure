name: jesterstreasure
description: "Jester Treasure — royal vault defender."
publish_to: 'none'
version: 1.0.1+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  appsflyer_sdk: ^6.16.2
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.2+10

  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.5
  http: ^1.4.0
  device_info_plus: ^11.5.0

  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0

  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1

  file_picker: 8.1.4
  clarity_flutter: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/Icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/Icon.png"
  adaptive_icon_foreground: "assets/Icon.png"
  adaptive_icon_foreground_inset: 22
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
