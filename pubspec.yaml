name: jesterstreasure
description: "Jester Treasure - hyper-casual mobile game."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/Icon.png"
  min_sdk_android: 21
  # Background image (same icon) fills every pixel of the 108dp adaptive
  # canvas so masks never reveal empty edges. Foreground is inset so the
  # whole icon fits inside the safe zone and never gets cropped.
  adaptive_icon_background: "assets/Icon.png"
  adaptive_icon_foreground: "assets/Icon.png"
  adaptive_icon_foreground_inset: 22
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
